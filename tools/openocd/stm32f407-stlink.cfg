# ST-Link/F407 adaptation of RM_Ecat's stm32h750b-disco.cfg (89a86d88).
# Default just flash configuration. Loading this file alone must not call init.
source [find interface/stlink.cfg]
if {[adapter name] eq "hla"} {
    transport select hla_swd
} else {
    transport select swd
}
source [find target/stm32f4x.cfg]
# Do not assume NRST wiring. The F4 driver uses a software reset without SRST.
reset_config none

# Current OpenOCD uses the native ST-Link driver; older releases use HLA.
proc fw_select_serial {serial} {
    if {[adapter name] eq "hla"} {
        hla_serial $serial
    } else {
        adapter serial $serial
    }
}
